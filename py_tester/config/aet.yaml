# PyTester Configuration - Dynamic Tables Tester
# Supports multi-platform via platform_overrides section.
# Run with --platform darwin | windows | auto (default)

system:
  root: "auto"
  auto_root_subpath: "../"
  tester_folder: "Tab_BatchTesting"
  main_topic: "DynamicTables"

# Default / shared Illustrator settings.
# Values under platform_overrides will merge over these per-platform.
illustrator:
  version: "30"
  com_name: "Illustrator.Application.30"
  plugin_name: "PDFExportTester"
  # Fallback defaults (used if platform_overrides missing a key)
  signature: "WAI30r"
  executable: "Illustrator.exe"
  plugin_search_paths: []

# Default / shared NMT settings.
nmt:
  shared_tickets:
    - "ImageCompare.ticket"
    - "IRender500.ticket"
  tolerance: 0.01
  dpi: 300

# ---------------------------------------------------------------------------
# Platform-specific overrides (deep-merged over defaults above)
# ---------------------------------------------------------------------------
platform_overrides:
  darwin:
    illustrator:
      signature: "MAI30r"
      executable: "Adobe Illustrator 2026"
      plugin_search_paths:
        - "/Applications/Adobe Illustrator 2026/Plug-ins.localized/Esko/Automated Testers"
        - "/Applications/Adobe Illustrator 2026/Plug-ins/Esko/Automated Testers"
        - "/Applications/Adobe Illustrator 2024/Plug-ins.localized/Esko/Automated Testers"
        - "/Applications/Adobe Illustrator 2024/Plug-ins/Esko/Automated Testers"
    nmt:
      driver: "/Applications/NDLModelTest.app/Contents/MacOS/NDLModelTestDriver"
      reporter: "/Applications/NDLModelTest.app/Contents/MacOS/NDLModelTestReporter"
      root: ""  # not used on macOS

  windows:
    illustrator:
      signature: "WAI30r"
      executable: "Illustrator.exe"
      plugin_search_paths:
        - "C:/Program Files/Adobe/Adobe Illustrator 2026/Plug-ins/Esko/Automated Testers"
        - "C:/Program Files/Adobe/Adobe Illustrator 2024/Plug-ins/Esko/Automated Testers"
    nmt:
      # Set root to the folder that contains NDLModelTest.app
      # Example: "C:/Program Files/NDLModelTest"
      # If empty, falls back to NMTROOT env var or common paths.
      root: "C:\\Esko\\bg_prog_ndlmodeltest_v260\\NDLModelTest.app\\Contents\\Windows"
      # driver / reporter are auto-derived from root on Windows:
      #   root + "NDLModelTest.app/Contents/Windows/NDLModelTestDriver.exe"
      # Leave driver/reporter blank here unless you need a custom path.
      driver: "NDLModelTestDriver.exe"
      reporter: "NDLModelTestReporter.exe"

actions:
  CREATE:
    description: "Create new tables from XML data"
    source:
      folder: "Source/Create"
      required: true
      auto_create: false
    input:
      type: "xml"
      mask: "*.xml"
      file_column: 1
    csv_columns:
      - name: "action"
        type: "string"
        required: true
      - name: "xml_file"
        type: "path"
        required: true
      - name: "table_type"
        type: "string"
        required: true
      - name: "version"
        type: "string"
        required: true
      - name: "language"
        type: "string"
        required: false
    processing:
      mode: "create"
      use_import_pdf: false
      use_import_ndlpdf: false
      output_subfolder: "Create"
    reference:
      folder: "Reference/Create"
      required: false
      auto_create: false

  RECOGNIZE:
    description: "Recognize tables in existing AI files"
    source:
      folder: "Source/Extract"
      required: true
      auto_create: false
    input:
      type: "ai"
      mask: "*.ai"
      file_column: 1
    csv_columns:
      - name: "action"
        type: "string"
        required: true
      - name: "ai_file"
        type: "path"
        required: true
      - name: "table_type"
        type: "string"
        required: true
      - name: "version"
        type: "string"
        required: true
      - name: "language"
        type: "string"
        required: false
    processing:
      mode: "recognize"
      use_import_pdf: false
      use_import_ndlpdf: false
      output_subfolder: "Extract"
    reference:
      folder: "Reference/Extract"
      required: false
      auto_create: false

  REGENERATE:
    description: "Regenerate tables in existing AI files"
    source:
      folder: "Source/Regenerate"
      required: true
      auto_create: false
    input:
      type: "ai"
      mask: "*.ai"
      file_column: 1
    csv_columns:
      - name: "action"
        type: "string"
        required: true
      - name: "ai_file"
        type: "path"
        required: true
      - name: "version"
        type: "string"
        required: true
      - name: "language"
        type: "string"
        required: false
    processing:
      mode: "regenerate"
      use_import_pdf: false
      use_import_ndlpdf: false
      output_subfolder: "Regenerate"
    reference:
      folder: "Reference/Regenerate"
      required: false
      auto_create: false

paths:
  tickets:
    name: "_Helpers/CSV"
    required: true
    auto_create: false
  testq:
    name: "_Helpers/TestQ"
    required: true
    auto_create: false
  processed:
    name: "Processed"
    required: false
    auto_create: true
  logs:
    name: "Logs"
    required: false
    auto_create: true
  reports:
    name: "Reports"
    required: false
    auto_create: true

monitoring:
  max_cycles: 1000
  poll_interval: 5
  crash_detection: true
  auto_kill_on_timeout: true

test_defaults:
  tester_name: "Dynamic Tables Tester"
  process_subfolder: false
  mask: "*.ai"
  use_import_pdf: false
  use_import_ndlpdf: false
  output_type: 3
  trap_ticket: "-"
  ink_mapping_file: "-"

comparison:
  engine: "NMT"
  tolerance: 0.01
  dpi: 300

reporting:
  email:
    smtp_server: "smtp.company.com"
    from: "pytester@company.com"
    to: ["qa@company.com"]
    subject_template: "PyTester Report - {topic} - {date}"
